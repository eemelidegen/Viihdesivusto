# Decap CMS: kirjoita ja julkaise juttuja selaimessa osoitteessa /admin/
# Kirjautuminen GitHub-tunnuksilla hoidetaan kansiossa functions/api/ (katso README.md).
backend:
  name: github
  repo: eemelidegen/Viihdesivusto
  branch: main
  auth_endpoint: api/auth

# Paikallinen testaus: aja `npx decap-server` ja avaa http://localhost:8080/admin/
local_backend: true

locale: fi
media_folder: src/assets/img/uploads
public_folder: /assets/img/uploads

collections:
  - name: artikkelit
    label: Artikkelit
    label_singular: Artikkeli
    folder: src/artikkelit
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: Otsikko, name: title, widget: string }
      - { label: Ingressi, name: excerpt, widget: text, hint: "1–2 lausetta, näkyy etusivulla ja hakukoneissa" }
      - { label: Julkaisuaika, name: date, widget: datetime }
      - label: Kategoria
        name: category
        widget: select
        options:
          - { label: Julkkikset, value: julkkikset }
          - { label: Kohut, value: kohut }
          - { label: Rikos, value: rikos }
          - { label: Urheilu, value: urheilu }
      - { label: Toimittaja, name: author, widget: string, default: Toimitus }
      - { label: Pääkuva, name: image, widget: image, required: false }
      - { label: Kuvan kuvaus (saavutettavuus), name: imageAlt, widget: string, required: false }
      - { label: Kuvaaja / kuvan lähde, name: imageCredit, widget: string, required: false }
      - { label: "Nosto (Suositut jutut & Luetuimmat)", name: nosto, widget: boolean, default: false, required: false }
      - { label: Luonnos (ei julkaista), name: draft, widget: boolean, default: false, required: false }
      - { label: Teksti, name: body, widget: markdown }
