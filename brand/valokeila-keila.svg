<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<defs>
<radialGradient id="bg" cx=".3" cy=".2" r=".95"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#d6123f"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6cc" stop-opacity="1"/><stop offset="1" stop-color="#fff6cc" stop-opacity=".35"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a30"/><stop offset="1" stop-color="#050506"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5a0018" flood-opacity=".5"/></filter></defs>
<rect width="1080" height="1080" fill="url(#bg)"/>
<g transform="translate(540 545) scale(1.04) translate(-565 -530)">
<!-- beam from the lens down to a pool of light -->
<polygon points="520,470 640,350 930,760 640,900" fill="url(#beam)" filter="url(#soft)"/>
<ellipse cx="770" cy="845" rx="210" ry="60" transform="rotate(-12 770 845)" fill="#fff6cc"/>
<!-- lamp: yoke, cylinder body, round lens facing down-right -->
<g filter="url(#drop)" transform="rotate(40 400 400)">
  <path d="M250 330 Q250 190 400 190 Q550 190 550 330" fill="none" stroke="#0d0d10" stroke-width="36" stroke-linecap="round" transform="rotate(-90 400 400)"/>
  <rect x="230" y="300" width="300" height="200" rx="38" fill="url(#body)"/>
  <rect x="200" y="330" width="40" height="140" rx="14" fill="#0d0d10"/>
  <ellipse cx="535" cy="400" rx="44" ry="118" fill="#0d0d10"/>
  <ellipse cx="540" cy="400" rx="30" ry="100" fill="#fff6cc"/>
  <rect x="270" y="330" width="16" height="140" rx="8" fill="#3a3940"/><rect x="306" y="330" width="16" height="140" rx="8" fill="#3a3940"/><rect x="342" y="330" width="16" height="140" rx="8" fill="#3a3940"/>
  <rect x="240" y="312" width="280" height="20" rx="10" fill="#fff" opacity=".08"/>
</g>
</g>
<!-- sparkles -->
<path d="M240 760 C246 800 255 809 295 815 C255 821 246 830 240 870 C234 830 225 821 185 815 C225 809 234 800 240 760Z" fill="#fff"/>
<path d="M830 200 C836 232 843 239 875 245 C843 251 836 258 830 290 C824 258 817 251 785 245 C817 239 824 232 830 200Z" fill="#fff" opacity=".85"/>
</svg>
